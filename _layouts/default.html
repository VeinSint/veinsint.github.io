<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header { 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 20px; 
            margin-bottom: 40px;
        }
        
        h1 { color: #f0f6fc; margin-bottom: 10px; }
        h2 { color: #58a6ff; margin: 30px 0 15px; }
        h3 { color: #79c0ff; margin: 20px 0 10px; }
        
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        nav { margin: 20px 0; }
        nav a { margin-right: 20px; font-weight: 600; }
        
        .tagline { color: #8b949e; font-size: 1.1em; }
        
        ul { margin-left: 20px; margin-top: 10px; }
        li { margin: 5px 0; }
        
        footer { 
            margin-top: 60px; 
            padding-top: 20px;
            border-top: 1px solid #30363d;
            color: #8b949e;
            font-size: 0.9em;
            text-align: center;
        }
        
        .post-date { color: #8b949e; font-size: 0.9em; margin-bottom: 10px; }
        .post-list { list-style: none; margin-left: 0; }
        .post-list li { border-bottom: 1px solid #21262d; padding: 15px 0; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="color: #f0f6fc;">{{ site.title }}</a></h1>
        <p class="tagline">{{ site.description }}</p>
        <nav>
            <a href="/">Главная</a>
            <a href="/cases">Кейсы</a>
            <a href="/methodology">Методология</a>
            <a href="/tools">Инструменты</a>
        </nav>
    </header>
    
    <main>
        {{ content }}
    </main>
    
    <footer>
        <p>© 2026 {{ site.title }} | OPSEC First</p>
    </footer>
</body>
</html>
